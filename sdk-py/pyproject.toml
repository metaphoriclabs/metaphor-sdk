[project]
name = "metaphor-sdk"
version = "0.0.0"
description = "Python SDK for the Metaphor API."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/metaphoriclabs/metaphor-sdk"

[dependency-groups]
dev = ["pytest>=9"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "3 days"
