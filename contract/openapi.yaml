                $ref: "#/components/schemas/Error"
        "401":
          description: No valid API key was sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The API key does not allow this, or not for this user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such memory, or no such shared space.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`user-erased`: the acting user was erased after the request was
            let in. Nothing was done. `space-refused`: the space cannot be
            served as it stands. Nothing was done. Sending the request again
            will not help."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: The API key sent more than 600 requests in a minute, the user's
            keys together more than 2000, or the tenant's keys together more
            than 6000. Wait the seconds `Retry-After` gives.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Something went wrong. Try again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The request could not be checked. Try again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
