openapi: 3.1.0
info:
  title: Metaphor API
  version: "1"
servers:
  - url: https://api.metaphoric.io
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: "An API key, sent as `Authorization: Bearer <key>`."
  schemas:
    ErrorCode:
      type: string
      enum:
        - invalid-request
        - unauthenticated
        - forbidden
        - not-found
        - key-limit
        - conflict
        - forget-undone
        - user-erased
        - space-refused
        - too-large
        - unsupported-media-type
        - rate-limited
        - open-forgets
        - internal
        - unavailable
      description: >-
        What went wrong. Each code always comes with the one HTTP status:


        - `invalid-request` (400): the request is not valid. `message` names the
        fields that are wrong.

        - `unauthenticated` (401): no valid API key was sent.

        - `forbidden` (403): the API key does not allow this.

        - `not-found` (404): no such route, or no such thing at it.

        - `key-limit` (409): the tenant or the user holds as many working keys
        as it may.

        - `conflict` (409): the request disagrees with what is kept, such as a
        source ID already used.

        - `forget-undone` (409): a forget sent again under an `Idempotency-Key`
        whose forget was undone. Nothing was taken.

        - `user-erased` (409): the acting user was erased after this request was
        let in. Nothing was done.

        - `space-refused` (409): the space cannot be served as it stands, such
        as a space whose tenant's settings changed in a way the space cannot
        follow. Nothing was done. Sending the request again will not help until
        the space is changed.

        - `too-large` (413): the request body is too large.

        - `unsupported-media-type` (415): the body was not sent as
        `application/json`.

        - `rate-limited` (429): too many requests, or a space's 200 forgets this
        hour. Wait the seconds `Retry-After` gives.

        - `open-forgets` (429): the space holds 5,000 forgets open. `frees_at`
        says when the earliest one's undo window ends, at most 30 days away.
        Undoing a forget frees a place at once.

        - `internal` (500): something went wrong. Try again.

        - `unavailable` (503): the request could not be checked or served. Try
        again. When `Retry-After` is sent, nothing was done: send the request
        again after that many seconds.


        New codes may be added. Treat one you do not know by its status.


        An SDK never sleeps on `Retry-After` for longer than 60 seconds. Past
        that, it returns the error with the time it may try again.
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
      required:
        - status
    NewApiKey:
      allOf:
        - $ref: "#/components/schemas/ApiKey"
        - type: object
          properties:
            key:
              type: string
              description: The key itself. It is shown once.
          required:
            - key
    Scope:
      type: string
      enum:
        - memories:read
        - memories:write
        - memories:forget
        - keys:manage
        - users:erase
      description: "What an API key may do. There is no scope that stands for all of
        them. `users:erase` is for erasing an end user, a route not yet served:
        a key may carry it, and reaches nothing with it until then."
    ApiKey:
      type: object
      properties:
        id:
          type: string
          pattern: ^[0-9a-f]{16}$
          example: 9f2c4e6a8b0d1f35
        name:
          type: string
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/Scope"
        user_id:
          type:
            - string
            - "null"
          description: The one user the key may act for. Null for a key of the tenant's
            own server, and for a key whose user was erased.
        held_to_user:
          type: boolean
          description: Whether the key was made for one user. A key whose user was erased
            is revoked and keeps `true` here, with `user_id` null and its name
            replaced, so nothing of the user's ID is left in it.
        created_at:
          type: string
          format: date-time
          example: 2027-01-31T09:30:00Z
        expires_at:
          type:
            - string
            - "null"
          format: date-time
          example: 2027-01-31T09:30:00Z
          description: Null for a key that never expires.
        revoked_at:
          type:
            - string
            - "null"
          format: date-time
          example: 2027-01-31T09:30:00Z
          description: Null for a key that is not revoked.
        last_used_at:
          type:
            - string
            - "null"
          format: date-time
          example: 2027-01-31T09:30:00Z
          description: When the key last passed its check, to within an hour, even if the
            route's scopes then refused the request. Null for a key never used.
        made_by:
          type:
            - string
            - "null"
          pattern: ^[0-9a-f]{16}$
          example: 9f2c4e6a8b0d1f35
          description: The ID of the key that made this one. Null for a key Metaphor made
            for the tenant. Revoking a key does not revoke the keys it made.
      required:
        - id
        - name
        - scopes
        - user_id
        - held_to_user
        - created_at
        - expires_at
        - revoked_at
        - last_used_at
        - made_by
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: One of `ErrorCode`, or a code added since. Treat a code you do not
                know by its status.
            message:
              type: string
          required:
            - code
            - message
      required:
        - error
    CreateApiKey:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[\\p{L}\\p{M}\\p{N}\\p{P}\\p{S}]+(?:
            [\\p{L}\\p{M}\\p{N}\\p{P}\\p{S}]+)*$"
          description: "Your label for the key: 1 to 64 letters, numbers, punctuation
            marks or symbols of any script, with single spaces between, in
            Unicode NFC. A character that draws nothing, such as a zero-width
            space or a Hangul filler, is refused."
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/Scope"
          minItems: 1
          maxItems: 5
        user_id:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 256
          pattern: ^[!#-[\]-~]+$
          default: null
          not:
            type: string
            pattern: "^metaphor:"
          description: 'The one end user the key may act for: your own ID, 1 to 256
            visible ASCII characters but `"` and `\`, not starting with
            `metaphor:`. Null for a key of your own server.'
        expires_at:
          type:
            - string
            - "null"
          format: date-time
          default: null
          example: 2027-01-31T09:30:00Z
      required:
        - name
        - scopes
      additionalProperties: false
    ApiKeyList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ApiKey"
      required:
        - data
    WrittenMemory:
      type: object
      properties:
        id:
          type: string
          pattern: ^[0-9a-f]{32}$
          description: A memory's ID, made from its source. The same source gives the same
            ID in every space, so an ID names a memory only within its space.
          example: 4f1c9a7e2b8d06c3a5e9f17b20d4c8e6
        status:
          type: string
          description: "`accepted` today."
      required:
        - id
        - status
    SpaceId:
      type: string
      pattern: ^[a-z0-9][a-z0-9-]{0,62}$
      description: "`personal` for the acting user's own space, or a shared space's
        ID: 1 to 63 lowercase letters, digits and hyphens, starting with a
        letter or digit. `personal` always answers: before the user's first
        write it holds nothing."
      example: personal
    UserId:
      type: string
      minLength: 1
      maxLength: 256
      pattern: ^[!#-[\]-~]+$
      description: "A member's ID, which Metaphor issued and which starts with
        `metaphor:`, or your own ID for an end user: 1 to 256 visible ASCII
        characters but `\"` and `\\`, not starting with `metaphor:`. Metaphor
        keeps an end user's ID as you send it only on a key held to that user. A
        service user's ID is issued by Metaphor, so it starts with `metaphor:`
        too."
      example: customer-4821
    WriteMemory:
      type: object
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 32000
          pattern: \S
          description: "What to remember: up to 32,000 characters, not all of them white
            space. It is never written to a log."
        source:
          $ref: "#/components/schemas/Source"
        occurred_at:
          type:
            - string
            - "null"
          format: date-time
          default: null
          example: 2027-01-31T09:30:00Z
          description: "When it happened, which may be long before it is sent. Null means
            now. Not kept yet: a value other than null is refused."
        audience:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/Principal"
          minItems: 1
          maxItems: 100
          default: null
          uniqueItems: true
          description: "Who may see it. Null takes the space's default: in a personal
            space, its user alone. A user may name themselves, groups they are
            in, and `project` when they are a member."
          example:
            - user:customer-4821
        agent:
          type:
            - string
            - "null"
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
          default: null
          description: "The agent writing it for the acting user, if one is, such as
            `claude-code`. Not kept yet: a value other than null is refused."
          example: claude-code
      required:
        - content
        - source
      additionalProperties: false
    Source:
      type: object
      properties:
        name:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,31}$
          description: "The source: `api`, `slack`, `gmail`, `claude-code` or another name
            of yours."
          example: api
        id:
          type: string
          minLength: 1
          maxLength: 256
          pattern: ^[!#-[\]-~]+$
          description: "The item's ID at the source. Writing the same source ID again with
            the same content changes nothing. Content is compared as it is kept,
            with credentials such as API keys hidden, so text that differs only
            in one counts as the same. With other content, it is refused with
            `conflict` until replacing an item is served. Once its memory is
            forgotten, the same content sent again changes nothing while the
            forget can be undone, and is then refused with `conflict`. Each
            author's source IDs are their own. The ID is kept sealed with its
            memory and erased with it, but the memory's ID is a hash of it that
            stays after the memory is forgotten, and in history after an erase.
            A guess at the source ID can be checked against that hash, so it
            must not hold content or personal data: use the source's own ID, not
            a title, a sentence or a person's name."
          example: ticket-1042
        url:
          type:
            - string
            - "null"
          maxLength: 2048
          format: uri
          pattern: ^https?:\/\/[\x21\x22\x24-\x2e\x30-\x3e\x41-\x5b\x5d-\x7e]+(?:[/?#][\x21-\x7e]*)?$
          default: null
          description: "A link to the item at the source: `http` or `https` only, in
            visible ASCII, with no user or password. Not kept yet: a value other
            than null is refused."
      required:
        - name
        - id
      additionalProperties: false
    Principal:
      type: string
      pattern: ^(?:project|user:[!#-[\]-~]{1,256}|group:(?:api|console|slack|google|github):[A-Za-z0-9._-]{1,128})$
      not:
        const: "user:metaphor:"
      description: "`user:<user ID>`, `group:<group ID>`, or `project` for every
        member of the key's project. End users, guests and service users are
        never in `project`. There is no entry for everyone, and none that
        denies."
      example: group:api:finance
    Recall:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RecallItem"
      required:
        - items
    RecallItem:
      type: object
      properties:
        text:
          type: string
        heading:
          type:
            - string
            - "null"
        occurred_at:
          type:
            - string
            - "null"
          format: date-time
          example: 2027-01-31T09:30:00Z
          description: When it happened, if known.
        memory_ids:
          type: array
          items:
            type: string
            pattern: ^[0-9a-f]{32}$
            description: A memory's ID, made from its source. The same source gives the same
              ID in every space, so an ID names a memory only within its space.
            example: 4f1c9a7e2b8d06c3a5e9f17b20d4c8e6
          maxItems: 20
          description: Up to 20 of the memories this line was made from, each one a memory
            the user can see. The newest come first, by the minute each was
            written. Memories written in the same minute come in order of ID,
            not the order they were written.
      required:
        - text
        - heading
        - occurred_at
        - memory_ids
    RecallRequest:
      type: object
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 4000
          description: The question, in the user's words. It is never written to a log.
        budget:
          type: integer
          minimum: 100
          maximum: 10000
          default: 2000
          description: The most tokens the answer's lines may take together.
      required:
        - question
      additionalProperties: false
    Forget:
      type: object
      properties:
        id:
          type: string
          pattern: ^[0-9a-f]{32}$
          example: b7e04c2a9d3f18e6c5a0f29d4b81e7c3
        state:
          type: string
          description: "Where what this forget took stands. `open`: gone from recall, and
            can be undone until `undo_until`. `undone`: brought back. `closed`:
            the undo window has closed and nothing of it can be read. `erased`:
            every key that could open a copy of it is destroyed too."
        undo_until:
          type:
            - string
            - "null"
          format: date-time
          example: 2027-01-31T09:30:00Z
        erased_at:
          type:
            - string
            - "null"
          format: date-time
          example: 2027-01-31T09:30:00Z
          description: When every key that could open a copy is, or will be, destroyed.
      required:
        - id
        - state
        - undo_until
        - erased_at
    ForgetUndoneError:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          properties:
            forget:
              allOf:
                - $ref: "#/components/schemas/Forget"
                - description: The forget the key was first sent with, which was undone.
          required:
            - forget
    OpenForgetsError:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          properties:
            frees_at:
              type: string
              format: date-time
              example: 2027-01-31T09:30:00Z
              description: When the earliest open forget's undo window ends, which frees a
                place. Undoing a forget frees one at once.
          required:
            - frees_at
    ForgetsPerHourError:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          properties:
            limit:
              type: string
              description: "Which limit was met. `forgets-per-hour`: the space made 200
                forgets this clock hour (UTC). A string, not a closed list, so a
                client made today still reads a limit added later. The
                per-minute limits send no `limit`."
          required:
            - limit
    ForgetRequest:
      anyOf:
        - type: object
          properties:
            what:
              type: string
              minLength: 1
              maxLength: 1000
              description: In the user's own words, such as `my phone number`.
          required:
            - what
          additionalProperties: false
        - type: object
          properties:
            memory_ids:
              type: array
              items:
                type: string
                pattern: ^[0-9a-f]{32}$
                description: A memory's ID, made from its source. The same source gives the same
                  ID in every space, so an ID names a memory only within its
                  space.
                example: 4f1c9a7e2b8d06c3a5e9f17b20d4c8e6
              minItems: 1
              maxItems: 100
              description: The memories to forget. An ID that names no memory the acting user
                can forget is passed over without an error, and the answer reads
                the same.
          required:
            - memory_ids
          additionalProperties: false
        - type: object
          properties:
            source:
              type: object
              properties:
                name:
                  type: string
                  pattern: ^[a-z0-9][a-z0-9-]{0,31}$
                  description: "The source: `api`, `slack`, `gmail`, `claude-code` or another name
                    of yours."
                  example: api
                id:
                  type: string
                  minLength: 1
                  maxLength: 256
                  pattern: ^[!#-[\]-~]+$
                  description: "The item's ID at the source. Writing the same source ID again with
                    the same content changes nothing. Content is compared as it
                    is kept, with credentials such as API keys hidden, so text
                    that differs only in one counts as the same. With other
                    content, it is refused with `conflict` until replacing an
                    item is served. Once its memory is forgotten, the same
                    content sent again changes nothing while the forget can be
                    undone, and is then refused with `conflict`. Each author's
                    source IDs are their own. The ID is kept sealed with its
                    memory and erased with it, but the memory's ID is a hash of
                    it that stays after the memory is forgotten, and in history
                    after an erase. A guess at the source ID can be checked
                    against that hash, so it must not hold content or personal
                    data: use the source's own ID, not a title, a sentence or a
                    person's name."
                  example: ticket-1042
              required:
                - name
                - id
              additionalProperties: false
            author:
              $ref: "#/components/schemas/UserId"
          required:
            - source
          additionalProperties: false
        - type: object
          properties:
            author:
              $ref: "#/components/schemas/UserId"
          required:
            - author
          additionalProperties: false
      description: "One of: `what`, in the user's words; `memory_ids`; `source`, every
        version of one item, with `author` when another user wrote it; or
        `author`, everything one user wrote in the space. Served today:
        `memory_ids`, and `source` without `author`, in the `personal` space.
        The others are refused with `invalid-request` until they are served."
    MemoryList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Memory"
        next:
          type:
            - string
            - "null"
          description: Send as `after` for the next page. Null on the last page. A page
            holds `limit` items unless it is the last.
      required:
        - data
        - next
    Memory:
      type: object
      properties:
        id:
          type: string
          pattern: ^[0-9a-f]{32}$
          description: A memory's ID, made from its source. The same source gives the same
            ID in every space, so an ID names a memory only within its space.
          example: 4f1c9a7e2b8d06c3a5e9f17b20d4c8e6
        content:
          type: string
        source:
          type: object
          properties:
            name:
              type:
                - string
                - "null"
              description: The source's name, as it was written. Null for a memory written
                before sources were kept, or written from the console's
                playground.
            id:
              type:
                - string
                - "null"
              description: The item's ID at the source, as it was written. It is kept with the
                memory and erased with it. Null when `name` is.
            url:
              type:
                - string
                - "null"
          required:
            - name
            - id
            - url
        author:
          type: object
          properties:
            user_id:
              type:
                - string
                - "null"
              description: "Null when the author is an end user other than the acting user:
                Metaphor keeps no other end user's ID as you send it, so it has
                none to show."
            agent:
              type:
                - string
                - "null"
              description: The agent that wrote it, if any.
          required:
            - user_id
            - agent
        audience:
          type: array
          items:
            type: string
          description: Who may see it. An entry naming an end user other than the acting
            user is left out, for the same reason.
        audience_omitted:
          type: integer
          description: How many entries were left out of `audience`.
        occurred_at:
          type: string
          format: date-time
          example: 2027-01-31T09:30:00Z
        received_at:
          type: string
          format: date-time
          example: 2027-01-31T09:30:00Z
        status:
          type: string
          description: "`stored`: kept. It is the one value served today, and does not say
            whether the memory is ready for recall. Other values may be added."
        last_recalled_at:
          type:
            - string
            - "null"
          format: date-time
          example: 2027-01-31T09:30:00Z
          description: When a recall last returned it, to the minute. Null when none has
            in the last 90 days. Forgetting it clears this, and an undo does not
            bring it back.
      required:
        - id
        - content
        - source
        - author
        - audience
        - audience_omitted
        - occurred_at
        - received_at
        - status
        - last_recalled_at
  parameters: {}
paths:
  /health:
    get:
      summary: Check the API is up
      responses:
        "200":
          description: The API is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/keys:
    post:
      summary: Make an API key
      description: "Needs `keys:manage`. The new key does no more than the key that
        asks: no scope that key lacks, no other user, and no later expiry. A
        tenant holds a limited number of working keys, and fewer for any one
        user."
      security: &a1
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKey"
      responses:
        "201":
          description: The key was made.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewApiKey"
        "400":
          description: The request is not valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid API key was sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The API key does not allow this.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The tenant or the user holds as many working keys as it may. Revoke
            one first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: The request body is too large.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: The body was not sent as `application/json`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: The API key sent more than 600 requests in a minute, the user's
            keys together more than 2000, the tenant's keys together more than
            6000, or the tenant's keys made as many keys as they may in 24
            hours. Wait the seconds `Retry-After` gives.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Something went wrong. Try again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The request could not be checked. Try again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      summary: List API keys
      description: Needs `keys:manage`. A key held to one user lists that user's keys.
        Revoked and expired keys are listed until their records are dropped.
      security: *a1
      responses:
        "200":
          description: The keys, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyList"
        "401":
          description: No valid API key was sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The API key does not allow this.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: The API key sent more than 600 requests in a minute, the user's
            keys together more than 2000, or the tenant's keys together more
            than 6000. Wait the seconds `Retry-After` gives.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Something went wrong. Try again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The request could not be checked. Try again.
