  /v1/spaces/{space_id}/forget:
    post:
      summary: Forget
      description: "Needs `memories:forget`, which reaches only what the acting user
        wrote. `memories:forget-others` reaches what others wrote too, by
        `memory_ids`, `source` or `author`, whether or not the acting user can
        see it; each such forget is recorded and shown to the author. `what`
        always reaches only the acting user's own writing. What a forget reaches
        leaves recall at once, with every memory made from it, and can be
        brought back until the undo window closes. It answers the same whether
        or not anything matched. A forget by `memory_ids` or `source` takes the
        memories named and what was made from them, and nothing else: the same
        number or fact in another memory stays until that memory is forgotten
        too, as does the reply to a forgotten message unless it is named too. A
        memory another forget has already taken is passed over: if that forget
        is undone, the memory comes back, and this one does not hold it. A space
        holds at most 5,000 forgets open at once, counting forgets that matched
        nothing: a forget past that answers 429 `open-forgets` and changes
        nothing, for at most 30 days, until the earliest open forget's undo
        window ends. `frees_at` gives that time. Undoing a forget frees a place
        at once. A space also makes at most 200 forgets in a clock hour (UTC),
        counting forgets that matched nothing: past that a forget answers 429
        `rate-limited`, changes nothing, and `Retry-After` gives the seconds
        until the hour ends. Undoing a forget gives back no place in the hour. A
        forget sent again under an `Idempotency-Key` already honoured is
        answered as before and is not counted. One whose forget was undone
        answers 409 `forget-undone` with that forget, and takes nothing. Reading
        or undoing a forget is never refused for it. The body may be up to
        16,384 bytes."
      security: *a1
      parameters:
        - schema:
            $ref: "#/components/schemas/SpaceId"
          required: true
          description: "`personal` for the acting user's own space, or a shared space's
            ID: 1 to 63 lowercase letters, digits and hyphens, starting with a
            letter or digit. `personal` always answers: before the user's first
            write it holds nothing."
          name: space_id
          in: path
        - schema:
            $ref: "#/components/schemas/UserId"
          required: false
          description: The user this request acts for. Required for a key of your own
            server; a key held to a user may leave it out, or send that user's
            ID. A server key acts for a member only where the owner turned that
            on for the project, and each such request is recorded.
          name: metaphor-user
          in: header
        - schema:
            type: string
            pattern: ^[\x21-\x7e]{1,255}$
          required: false
          description: "1 to 255 visible ASCII characters, such as a UUID. A forget sent
            again in the same space with the same key and the same memories is
            the same forget: it takes nothing more and answers where the first
            one stands now, under its ID, for as long as the space is kept. If
            that forget was undone, it answers 409 `forget-undone` and takes
            nothing: send a new key to forget again. The same key with other
            memories is another forget. Without it, each forget sent is a new
            one, so a forget sent again after its answer was lost has another
            ID, and only the first can undo what was taken."
          name: idempotency-key
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgetRequest"
      responses:
        "202":
          description: The forget is under way.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Forget"
        "400":
          description: The request is not valid, or names no user to act for.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid API key was sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The API key does not allow this, or not for this user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such shared space.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`forget-undone`: the forget was sent again under an
            `Idempotency-Key` whose forget was undone. Nothing was taken.
            `forget` is that forget. Send a new key to forget again.
            `user-erased`: the acting user was erased after the request was let
            in. Nothing was taken. `space-refused`: the space cannot be served
            as it stands. Nothing was done. Sending the request again will not
            help."
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/ForgetUndoneError"
                  - $ref: "#/components/schemas/Error"
        "413":
          description: The request body is longer than 16,384 bytes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: The body was not sent as `application/json`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "`rate-limited`: the API key sent more than 600 requests in a
            minute, the user's keys together more than 2000, or the tenant's
            keys together more than 6000, or the space made 200 forgets this
            clock hour, when `limit` is `forgets-per-hour`. Wait the seconds
            `Retry-After` gives. `open-forgets`: the space holds 5,000 forgets
            open, and `frees_at` says when a place frees. It sends no
            `Retry-After`."
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/OpenForgetsError"
                  - $ref: "#/components/schemas/ForgetsPerHourError"
                  - $ref: "#/components/schemas/Error"
        "500":
          description: Something went wrong. Try again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The request could not be checked, or the tenant is not set up for
            this space yet. Try again later.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
