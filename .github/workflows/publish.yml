# Publishes each package whose version isn't on its registry yet. Versions are set in
# Metaphor's main repository, and every sync to this repo runs this workflow. npm and PyPI
# use trusted publishing, so no tokens are stored.
#
# The jobs that hold an OIDC token run no code from the dependency tree. build installs,
# builds and packs without one, and npm and pypi only upload what it made. When every version
# is already published, only plan runs, so the environment approval fires only for a release.
name: Publish

on:
  push:
    branches: [main]

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Find unpublished versions
    runs-on: ubuntu-latest
    outputs:
      node-version: ${{ steps.plan.outputs.node-version }}
      npm: ${{ steps.plan.outputs.npm }}
      pypi: ${{ steps.plan.outputs.pypi }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 0.0.0 marks a package that has never been released.
      - name: Compare versions with npm and PyPI
        id: plan
        run: |
          published() {
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' "$1")
            case "$status" in
              200) return 0 ;;
              404) return 1 ;;
              *) echo "::error::$1 returned HTTP $status"; exit 1 ;;
            esac
          }

          npm='[]'
          while read -r package; do
            name=$(jq -r .name <<< "$package")
            version=$(jq -r .version <<< "$package")
            if published "https://registry.npmjs.org/${name/\//%2F}/${version}"; then continue; fi
            echo "- npm: \`${name}\` ${version}" >> "$GITHUB_STEP_SUMMARY"
            npm=$(jq -c --argjson package "$package" '. + [$package]' <<< "$npm")
          done < <(jq -c 'select(.private != true and (.version // "0.0.0") != "0.0.0")
            | {dir: (input_filename | ltrimstr("./") | rtrimstr("/package.json")), name, version}' \
            ./*/package.json)

          pypi=false
          read -r py_name py_version < <(python3 -I -c 'import tomllib
          project = tomllib.load(open("sdk-py/pyproject.toml", "rb"))["project"]
          print(project["name"], project["version"])')
          if [ "$py_version" != 0.0.0 ] &&
            ! published "https://pypi.org/pypi/${py_name}/${py_version}/json"; then
            echo "- PyPI: \`${py_name}\` ${py_version}" >> "$GITHUB_STEP_SUMMARY"
            pypi=true
          fi

          {
            echo "node-version=$(cat .node-version)"
            echo "npm=${npm}"
            echo "pypi=${pypi}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build and pack
    needs: plan
    if: needs.plan.outputs.npm != '[]' || needs.plan.outputs.pypi == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # pnpm pack writes the manifest that npm publishes: it applies publishConfig.exports and
      # replaces workspace: and catalog: ranges with versions.
      - name: Pack the npm packages
        if: needs.plan.outputs.npm != '[]'
        env:
          PACKAGES: ${{ needs.plan.outputs.npm }}
        run: |
          mapfile -t dirs < <(jq -r '.[].dir' <<< "$PACKAGES")
          for dir in "${dirs[@]}"; do
            pnpm --dir "$dir" pack --pack-destination "$RUNNER_TEMP/npm/$dir"
          done
      - if: needs.plan.outputs.npm != '[]'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm
          path: ${{ runner.temp }}/npm
          if-no-files-found: error
          retention-days: 1
      - if: needs.plan.outputs.pypi == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.23"
          enable-cache: false
          working-directory: sdk-py
      - if: needs.plan.outputs.pypi == 'true'
        run: uv build --out-dir "$RUNNER_TEMP/pypi"
        working-directory: sdk-py
      - if: needs.plan.outputs.pypi == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi
          path: ${{ runner.temp }}/pypi
          if-no-files-found: error
          retention-days: 1

  npm:
    name: Publish to npm
    needs: [plan, build]
    if: needs.plan.outputs.npm != '[]'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      # No registry-url: it would make npm look for a token instead of using OIDC.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.plan.outputs.node-version }}
          package-manager-cache: false
      - name: Check that npm supports trusted publishing
        run: |
          version=$(npm --version)
          if [ "$(printf '%s\n' 11.5.1 "$version" | sort -V | head -n 1)" != 11.5.1 ]; then
            echo "::error::Trusted publishing needs npm 11.5.1 or newer. This runner has ${version}."
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm
          path: ${{ runner.temp }}/npm
      # npm adds provenance on its own with trusted publishing. A version already on npm is
      # skipped, so a re-run carries on where a failed run stopped. --ignore-scripts keeps a
      # tarball's lifecycle scripts from running in this job.
      - name: Publish the packages
        env:
          PACKAGES: ${{ needs.plan.outputs.npm }}
        run: |
          shopt -s nullglob
          while read -r package; do
            dir=$(jq -r .dir <<< "$package")
            name=$(jq -r .name <<< "$package")
            version=$(jq -r .version <<< "$package")
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              "https://registry.npmjs.org/${name/\//%2F}/${version}")
            if [ "$status" = 200 ]; then
              echo "${name}@${version} is already on npm."
              continue
            fi
            tarballs=("$RUNNER_TEMP/npm/$dir"/*.tgz)
            if [ "${#tarballs[@]}" -ne 1 ]; then
              echo "::error::Expected one tarball for ${name}, found ${#tarballs[@]}."
              exit 1
            fi
            npm publish "${tarballs[0]}" --ignore-scripts
          done < <(jq -c '.[]' <<< "$PACKAGES")

  pypi:
    name: Publish the Python SDK to PyPI
    needs: [plan, build]
    if: needs.plan.outputs.pypi == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi
          path: ${{ runner.temp }}/pypi
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.23"
          enable-cache: false
      # --check-url skips files already on PyPI, so a re-run doesn't fail on them.
      - run: |
          uv publish --trusted-publishing always --check-url https://pypi.org/simple/ \
            "$RUNNER_TEMP"/pypi/*
